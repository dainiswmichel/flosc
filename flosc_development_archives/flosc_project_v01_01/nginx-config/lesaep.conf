# Nginx Configuration for LeSAEp Chat-Only
# Place in: /etc/nginx/sites-available/lesaep.com

server {
    server_name lesaep.com www.lesaep.com;
    
    # Proxy to WordPress (dainis.net)
    location / {
        proxy_pass https://dainis.net;
        proxy_set_header Host dainis.net;
        proxy_set_header X-Forwarded-Host lesaep.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy to FastAPI backend (same-origin, no CORS)
    location /lesaep-api/ {
        proxy_pass http://DROPLET_IP:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increase timeouts for Whisper processing
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
    
    # SSL (via Certbot)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lesaep.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesaep.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name lesaep.com www.lesaep.com;
    return 301 https://$server_name$request_uri;
}

# Instructions:
# 1. Replace DROPLET_IP with your actual droplet IP
# 2. Copy to: sudo nano /etc/nginx/sites-available/lesaep.com
# 3. Create symlink: sudo ln -s /etc/nginx/sites-available/lesaep.com /etc/nginx/sites-enabled/
# 4. Test: sudo nginx -t
# 5. Reload: sudo systemctl reload nginx
# 6. Get SSL: sudo certbot --nginx -d lesaep.com -d www.lesaep.com
