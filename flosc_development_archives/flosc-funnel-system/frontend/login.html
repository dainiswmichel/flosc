<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Course Access</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Access Your Results</h1>
            <p class="subtitle">Enter your email to receive a login link</p>
        </header>

        <main>
            <div class="login-container">
                <form id="login-form" onsubmit="requestLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="your@email.com" 
                            required
                            autofocus
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Send Magic Link
                    </button>
                </form>

                <div id="success-message" class="success-message" style="display: none;">
                    <h3>✅ Check Your Email!</h3>
                    <p>We've sent you a magic link. Click it to access your dashboard.</p>
                    <p class="note">The link expires in 1 hour.</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;">
                    <h3>❌ Oops!</h3>
                    <p id="error-text"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
