name: FLOSC v85 SOL-1 through SOL-5 finalizer

on:
  push:
    branches:
      - gpt-5-6-sol/wporg-remediation

permissions:
  contents: write

concurrency:
  group: flosc-v85-finalize
  cancel-in-progress: false

jobs:
  corrected-self-audit:
    if: ${{ contains(github.event.head_commit.message || '', '[sol-self-audit-v3-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CAND: pre-release-candidates/gpt-5-6-sol
      TARGET: pre-release-candidates/gpt-5-6-sol/flosc-by-gpt-5-6-sol/flosc
      REPORTS: pre-release-candidates/gpt-5-6-sol/remediation-tools/reports
      PRE_SOL1: 4ed0570a9972c5b38c747934d76b4fa12d37a2ce
      FIRST_SOL1: 22a6bb2d004e8eb7f33331306ac77586425412da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-5-6-sol/wporg-remediation

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Execute the corrected v3 self-audit run blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import yaml

          path = '.github/workflows/sol-v85-self-audit-remediate-v3.yml'
          with open(path, encoding='utf-8') as handle:
              workflow = yaml.safe_load(handle)

          steps = workflow['jobs']['self-audit-v3']['steps']
          run_steps = [step for step in steps if 'run' in step]
          print(f'V3_RUN_BLOCKS={len(run_steps)}')

          for number, step in enumerate(run_steps, 1):
              name = step.get('name', f'run block {number}')
              print(f'\n===== V3 STEP {number}/{len(run_steps)}: {name} =====', flush=True)
              proc = subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', step['run']],
                  env=os.environ.copy(),
                  text=True,
              )
              if proc.returncode:
                  print(f'V3_STEP_FAILED={name} EXIT={proc.returncode}', file=sys.stderr)
                  raise SystemExit(proc.returncode)
              print(f'V3_STEP_PASSED={name}', flush=True)
          PY
