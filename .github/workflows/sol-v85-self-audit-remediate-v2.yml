name: FLOSC v85 SOL-1 through SOL-5 self-audit remediation v2

on:
  push:
    branches: [gpt-5-6-sol/wporg-remediation]

permissions:
  contents: write

concurrency:
  group: flosc-v85-self-audit-v2
  cancel-in-progress: false

jobs:
  self-audit-v2:
    if: ${{ contains(github.event.head_commit.message || '', '[sol-self-audit-v2]') && !contains(github.event.head_commit.message || '', '[sol-self-audit-v2-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAND: pre-release-candidates/gpt-5-6-sol
      TARGET: pre-release-candidates/gpt-5-6-sol/flosc-by-gpt-5-6-sol/flosc
      REPORTS: pre-release-candidates/gpt-5-6-sol/remediation-tools/reports
      PRE_SOL1: 4ed0570a9972c5b38c747934d76b4fa12d37a2ce
      FIRST_SOL1: 22a6bb2d004e8eb7f33331306ac77586425412da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-5-6-sol/wporg-remediation

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install audit tools
        shell: bash
        run: |
          set -euo pipefail
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.4 dealerdirect/phpcodesniffer-composer-installer:^1.0 phpstan/phpstan:^2.1 szepeviktor/phpstan-wordpress:^2.0 php-stubs/wordpress-stubs:^6.7
          mkdir -p "$REPORTS"
          cat > /tmp/fingerprint.php <<'PHP'
          <?php
          function fp(string $p): string {
              $c=(string) file_get_contents($p); $a=[];
              foreach(token_get_all($c) as $t){
                  if(is_array($t)){
                      if(in_array($t[0],[T_WHITESPACE,T_COMMENT,T_DOC_COMMENT],true)) continue;
                      $a[]=token_name($t[0]).':'.$t[1];
                  } else { $a[]='C:'.$t; }
              }
              return hash('sha256',implode("\0",$a));
          }
          echo fp($argv[1]);
          PHP

      - name: SOL-1 restore human prose from pre-normalizer source
        shell: bash
        run: |
          set -euo pipefail
          out="$REPORTS/self-audit-v2-sol1-restoration.txt"; : > "$out"; restored=0
          while IFS= read -r f; do
            [[ -z "$f" || "${f##*.}" != php ]] && continue
            git show "$PRE_SOL1:$f" > /tmp/pre-sol1.php
            [[ "$(php /tmp/fingerprint.php "$f")" == "$(php /tmp/fingerprint.php /tmp/pre-sol1.php)" ]] || { echo "EXECUTABLE_MISMATCH $f" | tee -a "$out"; exit 1; }
            if ! cmp -s "$f" /tmp/pre-sol1.php; then
              cp /tmp/pre-sol1.php "$f"; php -l "$f" >> "$out"; echo "RESTORED $f" >> "$out"; restored=$((restored+1))
            fi
          done < <(git diff --name-only "$PRE_SOL1" "$FIRST_SOL1" -- "$TARGET")
          echo "RESTORED_PHP_FILES=$restored" | tee -a "$out"

      - name: SOL-1 fix only auto-fixable comment/docblock sniffs, one file at a time
        shell: bash
        run: |
          set -euo pipefail
          out="$REPORTS/self-audit-v2-sol1-per-file.txt"; : > "$out"; changed=0
          # Sniff CLASSES, not individual message codes. The v1 self-audit used
          # message codes here; PHPCBF consequently repaired zero files.
          SNIFFS='Squiz.Commenting.DocCommentAlignment,Generic.Commenting.DocComment,WordPress.WP.CapitalPDangit,Squiz.Commenting.FunctionComment'
          while IFS= read -r f; do
            before=$(sha256sum "$f"|awk '{print $1}'); exec_before=$(php /tmp/fingerprint.php "$f")
            set +e
            "$HOME/.composer/vendor/bin/phpcbf" --standard=WordPress --sniffs="$SNIFFS" --extensions=php "$f" >> "$out" 2>&1
            set -e
            exec_after=$(php /tmp/fingerprint.php "$f")
            [[ "$exec_before" == "$exec_after" ]] || { echo "EXECUTABLE_TOKEN_CHANGE $f" | tee -a "$out"; exit 1; }
            after=$(sha256sum "$f"|awk '{print $1}')
            if [[ "$before" != "$after" ]]; then
              changed=$((changed+1)); echo "===== $f =====" >> "$out"; php -l "$f" >> "$out"
              set +e; "$HOME/.composer/vendor/bin/phpcs" --standard=WordPress --extensions=php --report=source "$f" >> "$out" 2>&1; rc=$?; set -e
              echo "PHPCS_EXIT=$rc" >> "$out"
            fi
          done < <(find "$TARGET" -type f -name '*.php' -not -path '*/tests/*' -not -path '*/vendor/*' | sort)
          echo "COMMENT_ONLY_CHANGED_FILES=$changed" | tee -a "$out"

      - name: SOL-1 final shipping-tree measurement
        shell: bash
        run: |
          set +e
          "$HOME/.composer/vendor/bin/phpcs" --standard=WordPress --extensions=php --ignore="$TARGET/tests/*,$TARGET/vendor/*" --report=json "$TARGET" > "$REPORTS/self-audit-v2-sol1-final.json" 2>/dev/null
          rc=$?
          set -e
          python3 - <<'PY'
          import json,collections,os
          d=json.load(open(os.path.join(os.environ['REPORTS'],'self-audit-v2-sol1-final.json'))); c=collections.Counter(); total=files=0
          for b in (d.get('files') or {}).values():
              ms=b.get('messages') or []; files += bool(ms)
              for m in ms: c[m.get('source','')]+=1; total+=1
          p=os.path.join(os.environ['REPORTS'],'self-audit-v2-sol1-final-summary.txt')
          with open(p,'w') as h:
              h.write(f'SOL1_WPCS_TOTAL={total}\nSOL1_FILES_WITH_FINDINGS={files}\n')
              for k,v in c.most_common(): h.write(f'{v}\t{k}\n')
          print(open(p).read())
          PY
          echo "PHPCS_EXIT=$rc" > "$REPORTS/self-audit-v2-sol1-final-exit.txt"

      - name: SOL-2 iterative narrow PHPStan repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phpstan.neon <<NEON
          includes:
              - $HOME/.composer/vendor/szepeviktor/phpstan-wordpress/extension.neon
          parameters:
              level: 5
              excludePaths:
                  analyse:
                      - */tests/*
                      - */vendor/*
                      - */node_modules/*
              reportUnmatchedIgnoredErrors: false
              parallel:
                  maximumNumberOfProcesses: 1
          NEON
          out="$REPORTS/self-audit-v2-sol2-repairs.txt"; : > "$out"
          for pass in 1 2 3 4; do
            set +e
            "$HOME/.composer/vendor/bin/phpstan" analyse "$TARGET" --configuration=/tmp/phpstan.neon --error-format=json --no-progress --memory-limit=4G > "/tmp/sol2-$pass.json" 2>/dev/null
            set -e
            applied=$(python3 - "$pass" <<'PY'
          import json,os,re,pathlib,sys
          root=pathlib.Path(os.environ['TARGET']).resolve(); d=json.load(open('/tmp/sol2-'+sys.argv[1]+'.json')); n=0
          items=[]
          for raw,b in (d.get('files') or {}).items():
              clean=re.sub(r' \(in context of .+\)$','',raw.replace('\\','/')); p=pathlib.Path(clean)
              if not p.is_absolute(): p=(pathlib.Path.cwd()/p).resolve()
              try: rel=p.relative_to(root)
              except Exception: continue
              for m in b.get('messages') or []:
                  msg=m.get('message') or ''; line=int(m.get('line') or 0)
                  mm=re.search(r'function (esc_(?:attr|html|textarea|url)) expects string, .*\b(?:int|float)',msg,re.I)
                  if mm: items.append((p,rel,line,mm.group(1),msg))
          by={}
          for x in items: by.setdefault(x[0],[]).append(x)
          for p,rows in by.items():
              text=p.read_bytes().decode('utf-8','surrogateescape'); lines=text.splitlines(True)
              for _,rel,line,fn,msg in sorted(rows,key=lambda x:x[2],reverse=True):
                  i=line-1
                  if not 0<=i<len(lines): continue
                  pat=re.compile(r'('+re.escape(fn)+r'\(\s*)(?!\(string\)\s*)')
                  new,c=pat.subn(r'\1(string) ',lines[i],count=1)
                  if c: lines[i]=new; n+=1; print(f'PASS {sys.argv[1]} APPLIED {rel}:{line} {msg}',file=sys.stderr)
              p.write_bytes(''.join(lines).encode('utf-8','surrogateescape'))
          print(n)
          PY
            ) 2>> "$out"
            echo "PASS_${pass}_CASTS=$applied" >> "$out"
            [[ "$applied" == 0 ]] && break
          done
          mapfile -t changed_php < <(git diff --name-only -- "$TARGET" | grep '\.php$' || true)
          for f in "${changed_php[@]}"; do php -l "$f"; done > "$REPORTS/self-audit-v2-sol2-php-l.txt"
          set +e
          "$HOME/.composer/vendor/bin/phpstan" analyse "$TARGET" --configuration=/tmp/phpstan.neon --error-format=json --no-progress --memory-limit=4G > "$REPORTS/self-audit-v2-sol2-final.json" 2>/dev/null
          set -e
          python3 - <<'PY'
          import json,os,re,pathlib
          d=json.load(open(os.path.join(os.environ['REPORTS'],'self-audit-v2-sol2-final.json'))); narrow=[]
          for f,b in (d.get('files') or {}).items():
              for m in b.get('messages') or []:
                  ident=m.get('identifier') or ''; msg=m.get('message') or ''
                  if ident=='variable.undefined' or (ident=='argument.type' and re.search(r'esc_(?:attr|html|textarea|url)',msg,re.I)): narrow.append((f,m.get('line'),ident,msg))
          p=os.path.join(os.environ['REPORTS'],'self-audit-v2-sol2-final-narrow.txt')
          with open(p,'w') as h:
              h.write(f'SOL2_NARROW_REMAINING={len(narrow)}\n')
              for r in narrow: h.write('%s:%s [%s] %s\n'%r)
          print(open(p).read()[:12000])
          PY

      - name: SOL-2 prove template include-scope variables instead of guessing defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['TARGET']); caller=(root/'includes/full-page-mode/class-flosc-full-page-mode.php').read_text(encoding='utf-8',errors='replace')
          include=caller.find("include FLOSC_PLUGIN_DIR . 'admin/flosc-app.php'")
          vars=['user_state','user_data','flow_settings','identity','offers']; missing=[]; rows=[]
          for v in vars:
              hits=[m.start() for m in re.finditer(r'\$'+re.escape(v)+r'\s*=',caller)]
              ok=bool(hits) and min(hits)<include
              rows.append((v,ok,min(hits) if hits else -1,include))
              if not ok: missing.append(v)
          out=pathlib.Path(os.environ['REPORTS'])/'self-audit-v2-sol2-template-scope.txt'
          with out.open('w') as h:
              for v,ok,pos,inc in rows: h.write(f'{v}: ASSIGNED_BEFORE_INCLUDE={int(ok)} assignment={pos} include={inc}\n')
              h.write('TEMPLATE_SCOPE_UNPROVEN='+','.join(missing)+'\n')
          print(out.read_text())
          if missing: raise SystemExit(1)
          PY

      - name: SOL-3 external-service/readme reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,pathlib,urllib.parse
          root=pathlib.Path(os.environ['TARGET']); readme=(root/'readme.txt').read_text(encoding='utf-8',errors='replace').lower()
          urlrx=re.compile(r'https?://[^\s\"\'<>`)]+' ,re.I); callrx=re.compile(r'\bwp_remote_(?:get|post|request)\s*\(|\bfetch\s*\(',re.I)
          rows=[]; domains=set(); dynamic=[]
          for p in root.rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('tests','vendor','node_modules')) or p.suffix.lower() not in ('.php','.js','.mjs'): continue
              text=p.read_text(encoding='utf-8',errors='replace')
              for m in callrx.finditer(text):
                  line=text.count('\n',0,m.start())+1; window=text[max(0,m.start()-500):m.start()+900]; ds=[]
                  for u in urlrx.findall(window):
                      d=(urllib.parse.urlparse(u).hostname or '').lower()
                      if d: ds.append(d); domains.add(d)
                  (rows if ds else dynamic).append((str(p.relative_to(root)),line,sorted(set(ds))) if ds else (str(p.relative_to(root)),line))
          missing=sorted(d for d in domains if d not in readme); out=pathlib.Path(os.environ['REPORTS'])/'self-audit-v2-sol3.txt'
          with out.open('w') as h:
              h.write(f'LITERAL_CALL_SITES={len(rows)}\nDYNAMIC_OR_INTERNAL_CALL_SITES={len(dynamic)}\nLITERAL_DOMAINS={len(domains)}\nLITERAL_DOMAINS_NOT_NAMED_IN_README={len(missing)}\n')
              for d in missing: h.write('MISSING '+d+'\n')
              h.write('\nLITERAL\n'); [h.write(f'{a}:{b} {c}\n') for a,b,c in rows]
              h.write('\nDYNAMIC_OR_INTERNAL\n'); [h.write(f'{a}:{b}\n') for a,b in dynamic]
          print(out.read_text()[:12000])
          PY

      - name: SOL-4 robust historical rejection audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sol4.php <<'PHP'
          <?php
          $root=getenv('TARGET'); $fail=0; $out=[];
          function check($label,$ok){global $fail,$out;$out[]=($ok?'PASS ':'FAIL ').$label;if(!$ok)$fail++;}
          function no_comments($s){$o='';foreach(token_get_all($s) as $t){if(is_array($t)&&in_array($t[0],[T_COMMENT,T_DOC_COMMENT],true))continue;$o.=is_array($t)?$t[1]:$t;}return $o;}
          function fn_source($s,$name){$look=$match=$collect=false;$d=0;$r='';foreach(token_get_all($s) as $t){$x=is_array($t)?$t[1]:$t;if(!$match){if(is_array($t)&&T_FUNCTION===$t[0]){$look=true;continue;}if($look&&is_array($t)&&T_STRING===$t[0]){$match=$name===$t[1];$look=false;}if(!$match)continue;}if(!$collect){if('{'===$x){$collect=true;$d=1;$r='{';}continue;}$r.=$x;if('{'===$x)$d++;elseif('}'===$x&&!--$d)return $r;}return '';}
          $main=(string)file_get_contents("$root/flosc.php"); $readme=(string)file_get_contents("$root/readme.txt");
          preg_match('/^ \* Requires at least:\s*(\S+)/m',$main,$a); preg_match('/^Requires at least:\s*(\S+)/m',$readme,$b);
          check('flosc.php Requires at least 7.0',($a[1]??'')==='7.0'); check('readme Requires at least 7.0',($b[1]??'')==='7.0');
          $runtime=''; $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS));
          foreach($it as $f){$p=$f->getPathname();if(!$f->isFile()||substr($p,-4)!=='.php'||str_contains($p,'/tests/')||str_contains($p,'/vendor/'))continue;$runtime.="\n/*FILE:$p*/\n".no_comments((string)file_get_contents($p));}
          check('no executable hardcoded/import.php WordPress Importer bootstrap',!preg_match('~WP_PLUGIN_DIR\s*\.\s*[\'\"]/?wordpress-importer|wp-admin/includes/import\.php|\bWP_LOAD_IMPORTERS\b~i',$runtime));
          check('no executable FILTER_UNSAFE_RAW/FILTER_DEFAULT',!preg_match('/\bFILTER_(?:UNSAFE_RAW|DEFAULT)\b/',$runtime));
          $oauth=no_comments((string)file_get_contents("$root/includes/sso/class-oauth2-handler.php")); $allow=fn_source($oauth,'get_allowed_sso_redirect_hosts');
          check('SSO allowlist function found',$allow!==''); check('SSO allowlist does not read HTTP_HOST',$allow!==''&&strpos($allow,'HTTP_HOST')===false);
          $kb=fn_source(no_comments($main),'handle_kb_save_edit'); check('KB save handler found',$kb!=='');
          $im=$wm=[]; preg_match('/\$(?<raw>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*\$post\s*\[\s*["\']file_content["\']\s*\]\s*\?\?/',$kb,$im,PREG_OFFSET_CAPTURE); preg_match('/flosc_write_data_file\s*\(\s*\$target\s*,\s*\$(?<clean>[A-Za-z_][A-Za-z0-9_]*)\s*\)/',$kb,$wm,PREG_OFFSET_CAPTURE);
          $raw=$im['raw'][0]??'';$clean=$wm['clean'][0]??'';$ia=$im[0][1]??-1;$wa=$wm[0][1]??-1; check('KB file_content input located',$raw!==''); check('KB writer argument located',$clean!=='');
          $scalar=$size=$san=-1;
          if($raw!==''&&$clean!==''){$rt='\\$'.preg_quote($raw,'/');$ct='\\$'.preg_quote($clean,'/');$m=[];preg_match('/if\s*\(\s*!\s*is_(?:string|scalar)\s*\(\s*'.$rt.'\s*\)\s*\)/i',$kb,$m,PREG_OFFSET_CAPTURE);$scalar=$m[0][1]??-1;$m=[];preg_match('/(?:mb_)?strlen\s*\(\s*'.$rt.'\s*\)\s*(?:>=|>)\s*(?:\d+|[A-Z_][A-Z0-9_]*)/i',$kb,$m,PREG_OFFSET_CAPTURE);$size=$m[0][1]??-1;if($size<0){$m=[];preg_match('/flosc_sanitize_[A-Za-z0-9_]+\s*\(\s*'.$rt.'\s*,\s*(?:\d+|[A-Z_][A-Z0-9_]*)\s*\)/i',$kb,$m,PREG_OFFSET_CAPTURE);$size=$m[0][1]??-1;}$m=[];preg_match('/'.$ct.'\s*=\s*(?:sanitize_[A-Za-z0-9_]+|flosc_sanitize_[A-Za-z0-9_]+|wp_kses(?:_post)?)\s*\([^;]*'.$rt.'[^;]*\)\s*;/s',$kb,$m,PREG_OFFSET_CAPTURE);$san=$m[0][1]??-1;}
          check('KB scalar guard before write',$scalar>$ia&&$scalar<$wa); check('KB size guard before write',$size>$ia&&$size<$wa); check('KB sanitized value reaches writer',$san>$ia&&$san<$wa);
          file_put_contents(getenv('REPORTS').'/self-audit-v2-sol4.txt',implode("\n",$out)."\nFAILURES=$fail\n"); echo implode("\n",$out)."\nFAILURES=$fail\n"; exit($fail?1:0);
          PHP
          php /tmp/sol4.php

      - name: SOL-5 rebuild and re-audit the exact distribution ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CAND/flosc.zip"; tmp=$(mktemp -d); mkdir -p "$tmp/flosc"
          rsync -a --delete --exclude='tests/' --exclude='vendor/' --exclude='node_modules/' --exclude='.git/' "$TARGET/" "$tmp/flosc/"
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/$CAND/flosc.zip" flosc)
          sha=$(sha256sum "$CAND/flosc.zip"|awk '{print $1}'); bytes=$(stat -c%s "$CAND/flosc.zip"); entries=$(unzip -Z1 "$CAND/flosc.zip"|wc -l|tr -d ' '); tests=$(unzip -Z1 "$CAND/flosc.zip"|grep -c '^flosc/tests/'||true); vendor=$(unzip -Z1 "$CAND/flosc.zip"|grep -c '^flosc/vendor/'||true)
          printf '%s  flosc.zip\n' "$sha" > "$CAND/SHA256SUMS"
          rm -rf /tmp/v85zip; mkdir /tmp/v85zip; unzip -q "$CAND/flosc.zip" -d /tmp/v85zip
          find /tmp/v85zip/flosc -type f -name '*.php' -print0 | while IFS= read -r -d '' f; do php -l "$f"; done > "$REPORTS/self-audit-v2-sol5-php-l.txt"
          set +e; "$HOME/.composer/vendor/bin/phpcs" --standard=WordPress --extensions=php --report=json /tmp/v85zip/flosc > "$REPORTS/self-audit-v2-sol5-wpcs.json" 2>/dev/null; wrc=$?; set -e
          echo "ZIP_SHA256=$sha" | tee "$REPORTS/self-audit-v2-sol5-summary.txt"; echo "ZIP_BYTES=$bytes" >> "$REPORTS/self-audit-v2-sol5-summary.txt"; echo "ZIP_ENTRIES=$entries" >> "$REPORTS/self-audit-v2-sol5-summary.txt"; echo "TESTS_ENTRIES=$tests" >> "$REPORTS/self-audit-v2-sol5-summary.txt"; echo "VENDOR_ENTRIES=$vendor" >> "$REPORTS/self-audit-v2-sol5-summary.txt"; echo "WPCS_EXIT=$wrc" >> "$REPORTS/self-audit-v2-sol5-summary.txt"
          grep -n 'Requires at least:' /tmp/v85zip/flosc/flosc.php /tmp/v85zip/flosc/readme.txt >> "$REPORTS/self-audit-v2-sol5-summary.txt"; grep -n 'Version:' /tmp/v85zip/flosc/flosc.php | head -1 >> "$REPORTS/self-audit-v2-sol5-summary.txt"
          cat "$REPORTS/self-audit-v2-sol5-summary.txt"; [[ "$tests" == 0 && "$vendor" == 0 ]]

      - name: Write candid team-review self-audit
        shell: bash
        run: |
          set -euo pipefail
          sol1=$(grep '^SOL1_WPCS_TOTAL=' "$REPORTS/self-audit-v2-sol1-final-summary.txt"|cut -d= -f2); sol2=$(grep '^SOL2_NARROW_REMAINING=' "$REPORTS/self-audit-v2-sol2-final-narrow.txt"|cut -d= -f2); sha=$(grep '^ZIP_SHA256=' "$REPORTS/self-audit-v2-sol5-summary.txt"|cut -d= -f2); restored=$(grep '^RESTORED_PHP_FILES=' "$REPORTS/self-audit-v2-sol1-restoration.txt"|cut -d= -f2)
          cat > "$CAND/SELF-AUDIT-SOL-1-5.md" <<EOF
          # GPT-5.6 Sol — candid SOL-1 through SOL-5 self-audit

          This is the evaluation record for the team. It is not a WordPress.org-readiness certificate.

          ## Failures I found in my own work

          1. My first SOL-1 normalizer damaged human prose while reducing the WPCS number. It produced fragments and generic generated descriptions. That was a material quality failure even though executable tokens did not change.
          2. My first self-audit used PHPCBF message codes instead of sniff classes, restored the damaged prose, then fixed zero files. Its 4,134-finding result was therefore evidence of an incomplete SOL-1, not a successful remediation.
          3. An earlier one-file runner parsed PHPCS paths incorrectly and edited only one file. I rejected its resulting count as proof of a complete one-file pass.
          4. The first SOL-2 parser did not strip PHPStan's "(in context of class ...)" suffix. It therefore failed to resolve reported source paths.
          5. The first SOL-4 self-audit used brace counting on raw PHP text. That is not a reliable PHP function parser and caused the audit itself to fail before SOL-5. V2 uses PHP tokenization and comment-stripped executable source.
          6. Two earlier helper runs failed for tooling reasons: non-UTF8 decoding and an attempted Actions workflow self-update without workflow permission. Those are engineering failures in my remediation machinery and belong in the performance record.

          ## Enhancements made after self-audit

          - Restored $restored PHP files from the pre-normalizer source only after executable-token identity was proven file by file.
          - SOL-1 now uses only comment/docblock sniff classes, one file at a time, with executable-token identity checks, PHP lint, per-file PHPCS tollgates, and a final shipping-tree measurement. It does not generate replacement prose and does not run whole-standard PHPCBF.
          - SOL-2 now iterates only proven int/float-to-string esc_* boundary casts. Include-scope template variables are not given invented defaults; the actual caller is checked to prove they are assigned before admin/flosc-app.php is included.
          - SOL-3 re-inventories actual wp_remote_* and fetch call sites and separates nearby literal domains from dynamic/internal calls.
          - SOL-4 now extracts functions with PHP's tokenizer, strips comments before regression searches, and explicitly checks SSO HTTP_HOST trust plus the KB file-content validation chain.
          - SOL-5 rebuilds the distribution after all source edits, re-extracts that exact ZIP, PHP-lints it, reruns WPCS against the extracted artifact, and records a fresh SHA-256.

          ## Final evidence numbers for team evaluation

          - Full shipping-tree WordPress-standard PHPCS findings after SOL-1: $sol1. Residual findings are preserved in self-audit-v2-sol1-final.json; this number is not represented as zero or as WordPress.org approval evidence.
          - Narrow PHPStan findings still emitted after SOL-2: $sol2. The template undefined-variable items are separately proven against the include caller in self-audit-v2-sol2-template-scope.txt rather than silenced with guessed defaults.
          - SOL-3 evidence: remediation-tools/reports/self-audit-v2-sol3.txt.
